<svg
  width="180"
  height="180"
  viewBox="0 0 180 180"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- Main Lavender Gradient -->
    <linearGradient
      id="lavender"
      x1="20"
      y1="20"
      x2="160"
      y2="160"
    >
      <stop offset="0%" stop-color="#C8B6FF"/>
      <stop offset="50%" stop-color="#B79CFF"/>
      <stop offset="100%" stop-color="#8B7CF6"/>
    </linearGradient>

    <!-- Highlight Gradient -->
    <linearGradient
      id="glowGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#E8E0FF"/>
      <stop offset="100%" stop-color="#8B7CF6"/>
    </linearGradient>

    <!-- Soft Glow -->
    <filter
      id="softGlow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        stdDeviation="4"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- ================================= -->
  <!-- BACKGROUND -->
  <!-- ================================= -->

  <rect
    width="180"
    height="180"
    rx="42"
    fill="#0B0A14"
  />


  <!-- ================================= -->
  <!-- OUTER TECHNICAL RING -->
  <!-- ================================= -->

  <circle
    cx="90"
    cy="90"
    r="62"
    fill="none"
    stroke="#302844"
    stroke-width="2"
  />


  <!-- ================================= -->
  <!-- ORBITAL RING -->
  <!-- ================================= -->

  <path
    d="M90 28
       A62 62 0 0 1 147 65"
    fill="none"
    stroke="url(#lavender)"
    stroke-width="4"
    stroke-linecap="round"
  />

  <path
    d="M33 112
       A62 62 0 0 0 75 150"
    fill="none"
    stroke="#8B7CF6"
    stroke-width="4"
    stroke-linecap="round"
  />


  <!-- ================================= -->
  <!-- CENTRAL LETTER K -->
  <!-- ================================= -->

  <!-- Vertical -->
  <path
    d="M65 55 V125"
    fill="none"
    stroke="url(#glowGradient)"
    stroke-width="9"
    stroke-linecap="round"
  />

  <!-- Upper diagonal -->
  <path
    d="M65 91 L112 55"
    fill="none"
    stroke="url(#glowGradient)"
    stroke-width="9"
    stroke-linecap="round"
  />

  <!-- Lower diagonal -->
  <path
    d="M65 91 L115 126"
    fill="none"
    stroke="url(#glowGradient)"
    stroke-width="9"
    stroke-linecap="round"
  />


  <!-- ================================= -->
  <!-- DATA / AI NODES -->
  <!-- ================================= -->

  <circle
    cx="65"
    cy="55"
    r="5"
    fill="#E8E0FF"
    filter="url(#softGlow)"
  />

  <circle
    cx="65"
    cy="125"
    r="5"
    fill="#C8B6FF"
    filter="url(#softGlow)"
  />

  <circle
    cx="112"
    cy="55"
    r="5"
    fill="#B79CFF"
    filter="url(#softGlow)"
  />

  <circle
    cx="115"
    cy="126"
    r="5"
    fill="#8B7CF6"
    filter="url(#softGlow)"
  />


  <!-- ================================= -->
  <!-- ORBIT NODE -->
  <!-- ================================= -->

  <circle
    cx="147"
    cy="65"
    r="4"
    fill="#C8B6FF"
    filter="url(#softGlow)"
  />

</svg>
