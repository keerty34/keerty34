<svg
  width="1000"
  height="260"
  viewBox="0 0 1000 260"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Vakada Keerty - Data Scientist, Applied AI, ML Engineering"
>

  <defs>

    <linearGradient
      id="lavender"
      x1="120"
      y1="60"
      x2="760"
      y2="190"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#E8E0FF"/>
      <stop offset="35%" stop-color="#C8B6FF"/>
      <stop offset="70%" stop-color="#B79CFF"/>
      <stop offset="100%" stop-color="#8B7CF6"/>
    </linearGradient>

    <linearGradient
      id="glow"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#E8E0FF"/>
      <stop offset="100%" stop-color="#8B7CF6"/>
    </linearGradient>

    <filter
      id="softGlow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        stdDeviation="4"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- BACKGROUND -->

  <rect
    width="1000"
    height="260"
    rx="32"
    fill="#0B0A14"
  />


  <!-- SUBTLE FRAME -->

  <path
    d="M48 48 H952"
    stroke="#302844"
    stroke-width="1"
    stroke-opacity="0.5"
  />

  <path
    d="M48 212 H952"
    stroke="#302844"
    stroke-width="1"
    stroke-opacity="0.5"
  />


  <!-- ========================================= -->
  <!-- ORIGINAL KEERTY MARK -->
  <!-- ========================================= -->

  <g>

    <!-- Outer technical ring -->

    <circle
      cx="115"
      cy="130"
      r="72"
      fill="none"
      stroke="#302844"
      stroke-width="2"
    />


    <!-- Broken orbital ring - top -->

    <path
      d="M115 58
         A72 72 0 0 1 181 101"
      fill="none"
      stroke="url(#lavender)"
      stroke-width="4"
      stroke-linecap="round"
    />


    <!-- Broken orbital ring - bottom -->

    <path
      d="M49 155
         A72 72 0 0 0 98 202"
      fill="none"
      stroke="#8B7CF6"
      stroke-width="4"
      stroke-linecap="round"
    />


    <!-- ======================================= -->
    <!-- CENTRAL K -->
    <!-- ======================================= -->

    <!-- Vertical -->

    <path
      d="M90 95 V165"
      fill="none"
      stroke="url(#glow)"
      stroke-width="9"
      stroke-linecap="round"
      filter="url(#softGlow)"
    />


    <!-- Upper diagonal -->

    <path
      d="M90 130 L137 95"
      fill="none"
      stroke="url(#glow)"
      stroke-width="9"
      stroke-linecap="round"
      filter="url(#softGlow)"
    />


    <!-- Lower diagonal -->

    <path
      d="M90 130 L140 166"
      fill="none"
      stroke="url(#glow)"
      stroke-width="9"
      stroke-linecap="round"
      filter="url(#softGlow)"
    />


    <!-- ======================================= -->
    <!-- FOUR K NODES -->
    <!-- ======================================= -->

    <!-- Top node -->

    <circle
      cx="90"
      cy="95"
      r="5"
      fill="#E8E0FF"
      filter="url(#softGlow)"
    />


    <!-- Bottom node -->

    <circle
      cx="90"
      cy="165"
      r="5"
      fill="#C8B6FF"
      filter="url(#softGlow)"
    />


    <!-- Upper-right node -->

    <circle
      cx="137"
      cy="95"
      r="5"
      fill="#B79CFF"
      filter="url(#softGlow)"
    />


    <!-- Lower-right node -->

    <circle
      cx="140"
      cy="166"
      r="5"
      fill="#8B7CF6"
      filter="url(#softGlow)"
    />


    <!-- Orbit node -->

    <circle
      cx="181"
      cy="101"
      r="4"
      fill="#C8B6FF"
      filter="url(#softGlow)"
    />

  </g>


  <!-- ========================================= -->
  <!-- NAME -->
  <!-- ========================================= -->

  <text
    x="225"
    y="130"
    fill="url(#lavender)"
    font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
    font-size="54"
    font-weight="700"
    letter-spacing="4"
  >
    VAKADA KEERTY
  </text>


  <!-- ========================================= -->
  <!-- PROFESSIONAL IDENTITY -->
  <!-- ========================================= -->

  <text
    x="228"
    y="164"
    fill="#B8B1C9"
    font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
    font-size="16"
    font-weight="500"
    letter-spacing="2.5"
  >
    DATA SCIENTIST  ·  APPLIED AI  ·  ML ENGINEERING
  </text>


  <!-- ========================================= -->
  <!-- ACCENT LINE -->
  <!-- ========================================= -->

  <rect
    x="228"
    y="184"
    width="285"
    height="3"
    rx="1.5"
    fill="url(#glow)"
  />


  <!-- ========================================= -->
  <!-- RIGHT TECH DETAILS -->
  <!-- ========================================= -->

  <circle
    cx="875"
    cy="70"
    r="3.5"
    fill="#DCCFFF"
  />

  <circle
    cx="895"
    cy="70"
    r="3.5"
    fill="#BFA8FF"
  />

  <circle
    cx="915"
    cy="70"
    r="3.5"
    fill="#8B7CF6"
  />


  <path
    d="M875 190 H915"
    stroke="#302844"
    stroke-width="1"
  />

  <circle
    cx="875"
    cy="190"
    r="3"
    fill="#8B7CF6"
  />


  <!-- ========================================= -->
  <!-- MICRO BRAND DETAIL -->
  <!-- ========================================= -->

  <text
    x="875"
    y="207"
    fill="#5F5870"
    font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
    font-size="8"
    font-weight="500"
    letter-spacing="2"
  >
    AI · DATA · INSIGHT
  </text>

</svg>
